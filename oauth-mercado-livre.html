<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Autorização Mercado Livre | Naka Indica</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff8ef;color:#173e3b;font:16px system-ui,-apple-system,Arial,sans-serif}main{max-width:550px;background:white;border:1px solid #e8ded1;padding:30px;border-radius:24px}h1{font-size:27px}p{line-height:1.6}button{border:0;background:#173e3b;color:white;border-radius:12px;font-weight:700;padding:14px 20px;font-size:16px}textarea{width:100%;box-sizing:border-box;min-height:90px;border-radius:9px;padding:12px}small{color:#596662}</style>
<script>
(()=>{
 const p=new URLSearchParams(location.search), code=p.get('code'), state=p.get('state'), error=p.get('error');
 try{history.replaceState(null,'',location.pathname);}catch(e){}
 window.addEventListener('DOMContentLoaded',()=>{
  const status=document.getElementById('status'),desc=document.getElementById('desc'),button=document.getElementById('copy'),codefield=document.getElementById('code');
  const expected=sessionStorage.getItem('nakaMlOauthState'), start=Number(sessionStorage.getItem('nakaMlOauthStarted')||0);
  sessionStorage.removeItem('nakaMlOauthState');sessionStorage.removeItem('nakaMlOauthStarted');
  if(error){status.textContent='Autorização não concluída.';desc.textContent='A plataforma retornou um erro ou a autorização foi cancelada.';return;}
  if(!code){status.textContent='Nenhum código de autorização recebido.';desc.textContent='Abra a página de conexão e inicie a autorização.';return;}
  if(!state||state!==expected||Date.now()-start>15*60*1000||Date.now()<start){
   status.textContent='Não foi possível validar a autorização.';
   desc.textContent='Por segurança, reinicie a conexão na página Naka Indica no mesmo navegador e na mesma aba. O código não será exibido.';return;
  }
  status.textContent='Autorização recebida com segurança.';
  desc.textContent='Copie o código temporário e salve somente no Secret ML_AUTH_CODE do seu repositório privado no GitHub. Em seguida execute o workflow 03 - Conectar Mercado Livre (OAuth inicial). Não compartilhe o código nesta conversa.';
  button.hidden=false;
  button.addEventListener('click',async()=>{
   try{await navigator.clipboard.writeText(code);button.textContent='Código copiado';}
   catch(e){codefield.hidden=false;codefield.value=code;codefield.select();button.textContent='Selecione e copie o código acima';}
  });
 });
})();
</script></head><body><main><strong>Naka Indica</strong>
<h1>Retorno da autorização</h1>
<p id="status">Conferindo resposta...</p><p id="desc"></p>
<button id="copy" type="button" hidden>Copiar código temporário</button>
<textarea id="code" readonly hidden aria-label="Código temporário"></textarea>
<p><small>Esta página não envia códigos a outros serviços. Nenhum token de API é armazenado aqui. Evite capturas de tela contendo códigos.</small></p>
<p><a href="conectar-mercado-livre.html">Reiniciar conexão</a></p>
</main></body></html>
